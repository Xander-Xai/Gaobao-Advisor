# gaobao-advisor LLM Provider Configuration
# 环境变量可覆盖此文件中的任何配置项
# 用法: 设置 LLM_PROVIDER=agnes-flash-1 即可快速切换
#
# 默认 Provider 说明：仓库内的极简 YAML 解析器此前会把嵌套映射压平，
# 导致本文件的 providers/defaults 实际从未生效，运行时一直回落到硬编码的
# deepseek 默认值。解析器已修复，为避免一次与模型治理无关的隐式行为变更，
# 这里把 defaults.provider 显式写为 deepseek（与修复前的实际生效值一致）。
# 切换 Provider 请使用 LLM_PROVIDER 或修改本行。

providers:
  agnes-flash-1:
    base_url: "https://api.agnes.ai/v1"
    model: "agnes-2.0-flash"
    temperature: 0.7
    max_tokens: null

  agnes-flash-2:
    base_url: "https://api.agnes.ai/v1"
    model: "agnes-2.0-flash"
    temperature: 0.7
    max_tokens: null

  glm-4:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4"
    temperature: 0.7
    max_tokens: null

  deepseek:
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    temperature: 0.7
    max_tokens: null

  qwen:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    temperature: 0.7
    max_tokens: null

  moonshot:
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-8k"
    temperature: 0.7
    max_tokens: null

  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"
    temperature: 0.7
    max_tokens: null

  ollama:
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:7b"
    temperature: 0.7
    max_tokens: null

defaults:
  provider: "deepseek"
  temperature: 0.7
  enable_search: true
  max_tokens: null
