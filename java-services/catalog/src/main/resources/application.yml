server:
  port: 8081

spring:
  application:
    name: gaobao-catalog
  datasource:
    url: ${CATALOG_JDBC_URL:jdbc:mysql://localhost:3306/gaobao?useUnicode=true&characterEncoding=utf8}
    username: ${CATALOG_DB_USER:gaobao_reader}
    password: ${CATALOG_DB_PASSWORD:}
    hikari:
      read-only: true
      maximum-pool-size: 5
      connection-timeout: 3000
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: gaobao-catalog
