# Release candidate: externally managed MySQL/Redis, separate DB migration and TLS ingress.
# Requires approved data, unique current schema, private env files and explicit acceptance.
# docker compose --env-file .env.industrial -f docker-compose.industrial.yml up --build -d
services:
  api:
    build: .
    entrypoint: []
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file:
      - path: .env.industrial-api
        required: true
    environment:
      GAOBAO_RUNTIME_PROFILE: industrial
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?explicit managed MySQL required}
      REDIS_URL: ${REDIS_URL:?explicit managed Redis required}
      GAOBAO_DATA_APPROVAL_REF: ${GAOBAO_DATA_APPROVAL_REF:?data authorization reference required}
      AUTO_MIGRATE: "false"
      AUTO_SEED_DEMO: "false"
      DB_AUTO_CREATE: "false"
      QUALITY_TASK_MODE: async
      ADMIN_RATE_LIMIT_BACKEND: redis
      ENABLE_RAG_KB: "false"
      ENABLE_SYNTHETIC_AGENT_EXPERIMENT: "false"
      ENABLE_OUTBOUND_FETCH: "false"
      USER_MEMORY_ENABLED: "false"
      GAOBAO_CHAT_COMPACTION_ENABLED: "false"
      GAOBAO_CHAT_SNAPSHOT_ENABLED: "false"
      ADMISSIONS_RESEARCH_ENABLED: "false"
    volumes:
      - industrial_api_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    entrypoint: []
    command: ["python", "-m", "server.admin.worker"]
    restart: unless-stopped
    environment:
      GAOBAO_RUNTIME_PROFILE: industrial
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?explicit managed MySQL required}
      REDIS_URL: ${REDIS_URL:?explicit managed Redis required}
      GAOBAO_DATA_APPROVAL_REF: ${GAOBAO_DATA_APPROVAL_REF:?data authorization reference required}
      AUTO_MIGRATE: "false"
      AUTO_SEED_DEMO: "false"
      DB_AUTO_CREATE: "false"
      QUALITY_TASK_MODE: async
      ADMIN_RATE_LIMIT_BACKEND: redis
      ENABLE_RAG_KB: "false"
      ENABLE_SYNTHETIC_AGENT_EXPERIMENT: "false"
      ENABLE_OUTBOUND_FETCH: "false"
      USER_MEMORY_ENABLED: "false"
      GAOBAO_CHAT_COMPACTION_ENABLED: "false"
      GAOBAO_CHAT_SNAPSHOT_ENABLED: "false"
      ADMISSIONS_RESEARCH_ENABLED: "false"
      GAOBAO_CHAT_SNAPSHOT_MAINTENANCE_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from db.database import is_db_connected; from server.industrial_runtime import redis_ready; assert is_db_connected() and redis_ready()"]
      interval: 15s
      timeout: 5s
      retries: 5

  java-catalog:
    build:
      context: .
      dockerfile: java-services/catalog/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_JDBC_URL: ${CATALOG_JDBC_URL:?external MySQL JDBC URL required}
      CATALOG_DB_USER: ${CATALOG_DB_USER:?SELECT-only principal required}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?SELECT-only password required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8

  java-gateway:
    build:
      context: .
      dockerfile: java-services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:?explicit managed Redis required}
      JAVA_CATALOG_URI: http://java-catalog:8081
      PYTHON_API_URI: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      java-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.31.8-alpine3.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INDUSTRIAL_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/java/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      java-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  industrial_api_data:
