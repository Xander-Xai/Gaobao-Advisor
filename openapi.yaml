components:
  schemas:
    AdminLoginRequest:
      additionalProperties: false
      properties:
        password:
          maxLength: 256
          minLength: 8
          title: Password
          type: string
        username:
          maxLength: 64
          minLength: 3
          title: Username
          type: string
      required:
      - username
      - password
      title: AdminLoginRequest
      type: object
    AdminTokenOut:
      properties:
        access_token:
          title: Access Token
          type: string
        expires_in:
          title: Expires In
          type: integer
        token_type:
          const: bearer
          default: bearer
          enum:
          - bearer
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/AdminUserOut'
      required:
      - access_token
      - expires_in
      - user
      title: AdminTokenOut
      type: object
    AdminUserOut:
      properties:
        role:
          enum:
          - viewer
          - operator
          - admin
          title: Role
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - role
      title: AdminUserOut
      type: object
    AdmissionScoreOut:
      properties:
        avg_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Score
        batch:
          title: Batch
          type: string
        id:
          title: Id
          type: integer
        major_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Major Name
        max_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Score
        min_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Rank
        min_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Score
        plan_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Plan Count
        province:
          title: Province
          type: string
        subject_type:
          title: Subject Type
          type: string
        year:
          title: Year
          type: integer
      required:
      - id
      - major_name
      - province
      - year
      - batch
      - subject_type
      - min_score
      - avg_score
      - max_score
      - min_rank
      - plan_count
      title: AdmissionScoreOut
      type: object
    Approval:
      additionalProperties: false
      properties:
        spec_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Spec Sha256
          type: string
      required:
      - spec_sha256
      title: Approval
      type: object
    AuditLogOut:
      properties:
        action:
          title: Action
          type: string
        actor:
          title: Actor
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        detail:
          title: Detail
          type: object
        id:
          title: Id
          type: integer
        outcome:
          title: Outcome
          type: string
        request_id:
          title: Request Id
          type: string
        resource_id:
          title: Resource Id
          type: string
        resource_type:
          title: Resource Type
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - request_id
      - actor
      - role
      - action
      - resource_type
      - resource_id
      - outcome
      - detail
      - created_at
      title: AuditLogOut
      type: object
    AuditPageOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogOut'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        pages:
          title: Pages
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      - pages
      title: AuditPageOut
      type: object
    ChatRequest:
      properties:
        message:
          maxLength: 3000
          minLength: 1
          title: Message
          type: string
        scene:
          default: gaokao
          title: Scene
          type: string
        session_id:
          description: 会话ID：4-64位字母数字下划线连字符
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
        slots:
          anyOf:
          - type: object
          - type: 'null'
          title: Slots
      required:
      - session_id
      - message
      title: ChatRequest
      type: object
    DataAvailabilityOut:
      properties:
        available_years:
          items:
            type: integer
          title: Available Years
          type: array
        has_plans:
          title: Has Plans
          type: boolean
        has_scores:
          title: Has Scores
          type: boolean
        subject_types:
          items:
            type: string
          title: Subject Types
          type: array
      required:
      - has_scores
      - has_plans
      title: DataAvailabilityOut
      type: object
    DataCountsOut:
      properties:
        admission_scores:
          default: 0
          title: Admission Scores
          type: integer
        enrollment_plans:
          default: 0
          title: Enrollment Plans
          type: integer
        majors:
          default: 0
          title: Majors
          type: integer
        schools:
          default: 0
          title: Schools
          type: integer
        score_rank_rows:
          default: 0
          title: Score Rank Rows
          type: integer
        subject_rankings:
          default: 0
          title: Subject Rankings
          type: integer
      title: DataCountsOut
      type: object
    DataOverviewOut:
      properties:
        counts:
          $ref: '#/components/schemas/DataCountsOut'
        data_profile:
          title: Data Profile
          type: string
        latest_admission_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Admission Year
        levels:
          items:
            type: string
          title: Levels
          type: array
        notice:
          title: Notice
          type: string
        provinces:
          items:
            type: string
          title: Provinces
          type: array
        school_types:
          items:
            type: string
          title: School Types
          type: array
        schools_with_plans:
          default: 0
          title: Schools With Plans
          type: integer
        schools_with_scores:
          default: 0
          title: Schools With Scores
          type: integer
        scores_by_year:
          items:
            $ref: '#/components/schemas/YearCountOut'
          title: Scores By Year
          type: array
        snapshot:
          anyOf:
          - $ref: '#/components/schemas/DatasetSnapshotOut'
          - type: 'null'
        subject_types:
          items:
            type: string
          title: Subject Types
          type: array
        year_from:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year From
        year_to:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year To
        years:
          items:
            type: integer
          title: Years
          type: array
      required:
      - data_profile
      - notice
      - counts
      title: DataOverviewOut
      type: object
    DatasetSnapshotOut:
      properties:
        dataset_version:
          title: Dataset Version
          type: string
        generated_at:
          format: date-time
          title: Generated At
          type: string
        is_synthetic:
          default: false
          title: Is Synthetic
          type: boolean
        profile:
          title: Profile
          type: string
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        source_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Note
        year_from:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year From
        year_to:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year To
      required:
      - dataset_version
      - profile
      - generated_at
      title: DatasetSnapshotOut
      type: object
    EnrollmentPlanOut:
      properties:
        batch:
          anyOf:
          - type: string
          - type: 'null'
          title: Batch
        id:
          title: Id
          type: integer
        major_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Major Name
        plan_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Plan Count
        province:
          title: Province
          type: string
        subject_requirement:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Requirement
        tuition:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tuition
        year:
          title: Year
          type: integer
      required:
      - id
      - major_name
      - province
      - year
      - plan_count
      - subject_requirement
      - batch
      - tuition
      title: EnrollmentPlanOut
      type: object
    FeedbackRequest:
      description: 用户反馈请求
      properties:
        feedback_text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Feedback Text
        message_index:
          maximum: 10000.0
          minimum: 0.0
          title: Message Index
          type: integer
        quality_score_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Quality Score Id
        rating:
          pattern: ^(helpful|not_helpful)$
          title: Rating
          type: string
        session_id:
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
      required:
      - session_id
      - message_index
      - rating
      title: FeedbackRequest
      type: object
    FilterOptionsOut:
      properties:
        levels:
          items:
            type: string
          title: Levels
          type: array
        majors:
          items:
            type: string
          title: Majors
          type: array
        provinces:
          items:
            type: string
          title: Provinces
          type: array
        school_types:
          items:
            type: string
          title: School Types
          type: array
        subject_types:
          items:
            type: string
          title: Subject Types
          type: array
        years:
          items:
            type: integer
          title: Years
          type: array
      title: FilterOptionsOut
      type: object
    GenerateRequest:
      description: Request body for report generation.
      properties:
        session_id:
          title: Session Id
          type: string
        student_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Name
      required:
      - session_id
      title: GenerateRequest
      type: object
    GenerateResponse:
      description: Response body for report generation.
      properties:
        message:
          title: Message
          type: string
        report_id:
          title: Report Id
          type: string
        status:
          title: Status
          type: string
      required:
      - report_id
      - status
      - message
      title: GenerateResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HighlightExtractRequest:
      description: 金句提取请求
      properties:
        content:
          maxLength: 2000
          minLength: 10
          title: Content
          type: string
        score:
          default: 0
          maximum: 100.0
          minimum: 0.0
          title: Score
          type: integer
        session_id:
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
      required:
      - session_id
      - content
      title: HighlightExtractRequest
      type: object
    KnowledgeSearchRequest:
      properties:
        groups:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Groups
        query:
          title: Query
          type: string
        top_k:
          default: 5
          title: Top K
          type: integer
      required:
      - query
      title: KnowledgeSearchRequest
      type: object
    MemoryWrite:
      properties:
        expected_version:
          maximum: 2147483646.0
          minimum: 0.0
          title: Expected Version
          type: integer
        ttl_days:
          default: 180
          maximum: 365.0
          minimum: 1.0
          title: Ttl Days
          type: integer
        value:
          maxLength: 120
          minLength: 1
          title: Value
          type: string
      required:
      - value
      - expected_version
      title: MemoryWrite
      type: object
    NewChatResearch:
      additionalProperties: false
      properties:
        idempotency_key:
          pattern: ^[A-Za-z0-9_.:-]{8,96}$
          title: Idempotency Key
          type: string
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        session_id:
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
      required:
      - session_id
      - idempotency_key
      - scope
      title: NewChatResearch
      type: object
    NewResearch:
      additionalProperties: false
      properties:
        approval_ref:
          maxLength: 200
          minLength: 1
          title: Approval Ref
          type: string
        idempotency_key:
          pattern: ^[A-Za-z0-9_.:-]{8,96}$
          title: Idempotency Key
          type: string
        image_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Image Id
          type: string
        model_id:
          pattern: ^openai:[A-Za-z0-9_.-]{2,100}$
          title: Model Id
          type: string
        scope:
          $ref: '#/components/schemas/ScopeRequest'
      required:
      - scope
      - model_id
      - image_id
      - approval_ref
      - idempotency_key
      title: NewResearch
      type: object
    NewSyntheticPortfolioTaskRun:
      additionalProperties: false
      description: Explicitly non-model, operator-approved multi-candidate research.
      properties:
        idempotency_key:
          maxLength: 96
          minLength: 8
          pattern: ^[A-Za-z0-9_.:-]+$
          title: Idempotency Key
          type: string
        portfolio:
          $ref: '#/components/schemas/SyntheticPortfolioRequest'
      required:
      - portfolio
      - idempotency_key
      title: NewSyntheticPortfolioTaskRun
      type: object
    NewSyntheticTaskRun:
      properties:
        engine:
          default: deterministic
          enum:
          - deterministic
          - deepagents
          - native_harness
          title: Engine
          type: string
        idempotency_key:
          maxLength: 96
          minLength: 8
          pattern: ^[A-Za-z0-9_.:-]+$
          title: Idempotency Key
          type: string
        profile:
          $ref: '#/components/schemas/SyntheticDecisionCardRequest'
      required:
      - profile
      - idempotency_key
      title: NewSyntheticTaskRun
      type: object
    NextQuestionResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        question:
          anyOf:
          - type: string
          - type: 'null'
          title: Question
        round_count:
          title: Round Count
          type: integer
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - question
      - round_count
      - is_complete
      title: NextQuestionResponse
      type: object
    OnboardingRequest:
      properties:
        data:
          title: Data
          type: object
        step:
          title: Step
          type: integer
      required:
      - step
      - data
      title: OnboardingRequest
      type: object
    PlanRowOut:
      properties:
        batch:
          anyOf:
          - type: string
          - type: 'null'
          title: Batch
        duration:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration
        id:
          title: Id
          type: integer
        major_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Major Name
        plan_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Plan Count
        province:
          title: Province
          type: string
        subject_requirement:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Requirement
        tuition:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tuition
        year:
          title: Year
          type: integer
      required:
      - id
      - province
      - year
      title: PlanRowOut
      type: object
    PortfolioReviewSignoff:
      additionalProperties: false
      description: A signed-in administrator reviews a frozen *fictional* receipt
        hash.
      properties:
        receipt_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Receipt Sha256
          type: string
        verdict:
          enum:
          - verified_historical_only
          - reject
          title: Verdict
          type: string
      required:
      - verdict
      - receipt_sha256
      title: PortfolioReviewSignoff
      type: object
    ProfileResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        missing_fields:
          items:
            type: string
          title: Missing Fields
          type: array
        profile:
          title: Profile
          type: object
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - profile
      - is_complete
      - missing_fields
      title: ProfileResponse
      type: object
    ProfileUpdateRequest:
      properties:
        field:
          maxLength: 32
          minLength: 1
          title: Field
          type: string
        value:
          maxLength: 200
          minLength: 1
          title: Value
          type: string
      required:
      - field
      - value
      title: ProfileUpdateRequest
      type: object
    PublishSyntheticEvidenceMemory:
      additionalProperties: false
      description: Explicit opt-in for indexing independently rechecked fictional
        receipts.
      properties:
        ttl_seconds:
          default: 86400
          maximum: 2592000.0
          minimum: 60.0
          title: Ttl Seconds
          type: integer
      title: PublishSyntheticEvidenceMemory
      type: object
    QualityIssueOut:
      properties:
        entity_id:
          title: Entity Id
          type: integer
        entity_type:
          title: Entity Type
          type: string
        field_name:
          title: Field Name
          type: string
        id:
          title: Id
          type: integer
        message:
          title: Message
          type: string
        rule_code:
          title: Rule Code
          type: string
        severity:
          enum:
