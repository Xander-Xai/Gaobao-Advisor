  /api/v1/health:
    get:
      description: 'Liveness probe with DB status and optional-subsystem state.


        ``status`` is ``ok`` only when required dependencies are healthy.

        ``optional_services`` reports each optional subsystem separately so a

        caller can tell "working" apart from "degraded".'
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
      tags:
      - health
  /api/v1/health/live:
    get:
      description: 'Liveness probe — the process is up and serving requests.


        Deliberately dependency-free: it must not fail because a downstream

        subsystem is degraded (that is what readiness is for).'
      operationId: liveness_api_v1_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Liveness
      tags:
      - health
  /api/v1/health/ready:
    get:
      description: 'Readiness probe — required dependencies are usable.


        The database is required: if it is unreachable the service is not ready

        (HTTP 503). RAG is optional and reported as a degraded capability rather

        than blocking readiness.'
      operationId: readiness_api_v1_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
      tags:
      - health
