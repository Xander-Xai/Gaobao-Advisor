name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  deepagents-sdk:
    name: Deep Agents SDK Optional Integration (No Network Calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install optional Deep Agents SDK and core test dependencies
        run: pip install -e ".[dev]" -r requirements-deepagents.txt
      - name: SDK constructor smoke, no provider API calls
        run: python -m pytest tests/test_deepagents_sdk_smoke.py tests/test_admissions_deepagents.py tests/test_deepagents_sqlite_checkpoint.py tests/test_deepagents_durable_tool_ledger.py -q --no-cov --override-ini addopts=''
      - name: Verify default production API does not import Deep Agents
        run: python -c "import server.main; print('web startup import passed without Agent invocation')"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Generate synthetic demo database
        run: python -m scripts.seed_demo_data --db data/demo.db --reset
      - name: Run tests with coverage
        run: python -m pytest tests/ --tb=short --cov-fail-under=70
      - name: Generate synthetic Agent Harness and draft Ground Truth evidence
        if: matrix.python-version == '3.11'
        run: |
          mkdir -p /tmp/gaobao-agent-evidence
          python -m benchmarks.readonly_harness_eval --out /tmp/gaobao-agent-evidence/readonly-policy-30cases.json
          python -m benchmarks.groundtruth_pipeline --out /tmp/gaobao-agent-evidence/groundtruth-pending-review.json
          python -m benchmarks.decision_card_business_eval --out /tmp/gaobao-agent-evidence/business-8case-deterministic-baseline.json
          python -m benchmarks.chat_gate_eval --out /tmp/gaobao-agent-evidence/chat-gate-synthetic-eval.json
          python -m benchmarks.synthetic_replanning_eval --inject-transient --out /tmp/gaobao-agent-evidence/replanning-8case-scripted.json
          python -m benchmarks.context_ab_eval --scripted-smoke --out-dir /tmp/gaobao-context-ab-ci
          cp /tmp/gaobao-context-ab-ci/context-ab-summary.json /tmp/gaobao-agent-evidence/context-ab-scripted-summary.json
          python -m benchmarks.sql_rag_pair_eval --repeat 12 --warmup 2 --out /tmp/gaobao-agent-evidence/sql-rag-paired-synthetic.json
          python -m benchmarks.taskrun_lifecycle_eval --max-cases 8 --out /tmp/gaobao-agent-evidence/taskrun-lifecycle-8case-baseline.json
          python -m benchmarks.synthetic_portfolio_eval --out /tmp/gaobao-agent-evidence/multicandidate-synthetic-evidence.json
          python -m benchmarks.taskrun_crash_recovery_eval --out /tmp/gaobao-agent-evidence/taskrun-crash-recovery.json
          python -m benchmarks.portfolio_taskrun_eval --out /tmp/gaobao-agent-evidence/portfolio-taskrun-independent-oracle.json
      - name: Upload synthetic Agent Harness evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.2
        with:
          name: agent-harness-synthetic-evidence
          path: /tmp/gaobao-agent-evidence/*.json
          retention-days: 7
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.2
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  integration:
    name: MySQL + Redis + Admin Smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: gaobao_test
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,mysql,worker]"
      - name: MySQL + Redis integration tests
        run: |
          MYSQL_TEST_URL='mysql+pymysql://root:testroot@127.0.0.1:3307/gaobao_test?charset=utf8mb4' \
          REDIS_TEST_URL='redis://127.0.0.1:6380/0' \
            python -m pytest tests/test_admin_mysql.py tests/test_mysql_migrations.py tests/test_admin_limits_redis.py tests/test_redis_worker.py tests/test_worker_integration.py tests/test_queue_recovery.py \
              -q --no-header --no-cov
      - name: Admin login -> quality job -> review -> audit smoke
        run: python scripts/admin_smoke.py
      - name: MySQL benchmark smoke
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(host="127.0.0.1", port=3307, user="root", password="testroot")
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE IF NOT EXISTS gaobao_benchmark")
          connection.commit()
          connection.close()
          PY
          MYSQL_BENCH_URL='mysql+pymysql://root:testroot@127.0.0.1:3307/gaobao_benchmark?charset=utf8mb4' \
            python -m benchmarks.mysql_admin_benchmark \
              --schools 100 --scores-per-school 2 --audit-rows 500 --job-rows 20 \
              --concurrency 2 --warmup 1 --repeat 3 --json-out /tmp/benchmark-smoke.json
          python - <<'PY'
          import json
          result = json.load(open("/tmp/benchmark-smoke.json"))
          assert result["workloads"]["schools_page_1"]["samples"] == 3
          assert result["index_experiment"]["after"]["audit_page_1"]["samples"] == 3
          assert result["concurrency"]["error_rate"] == 0
          print("benchmark smoke ok")
          PY
      - name: Queue recovery smoke
        run: |
          MYSQL_BENCH_URL='mysql+pymysql://root:testroot@127.0.0.1:3307/gaobao_benchmark?charset=utf8mb4' \
          REDIS_BENCH_URL='redis://127.0.0.1:6380/0' \
            python -m benchmarks.queue_recovery.runner \
              --suite fault --schemes list --scenarios published_not_consumed duplicate_delivery \
              --repeats 1 --json-out /tmp/queue-recovery-smoke.json
          python - <<'PY'
          import json
          result = json.load(open("/tmp/queue-recovery-smoke.json"))
          assert result["faults"], "no queue recovery results"
          assert all(row["status"] == "PASS" for row in result["faults"]), result["faults"]
          print("queue recovery smoke ok")
          PY

  full-compose-e2e:
    name: Full Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install configuration generator dependencies
        run: python -m pip install -e .
      - name: Build and validate full Compose deployment (synthetic data)
        run: bash scripts/verify_full_compose_ci.sh
      - name: Upload full Compose failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.2
        with:
          name: full-compose-e2e-logs
          path: ${{ runner.temp }}/gaobao-full-compose-logs/
          if-no-files-found: ignore
          retention-days: 3

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.lock --progress-spinner off
      - name: pip-audit (optional legacy admin dependency set)
        # The runtime lock above must stay at zero known vulnerabilities.
        # The legacy set is optional, never shipped and never installed by
        # default. E-001 was closed by streamlit 1.66.1 + pillow 13.0.0, so
        # this audit now has no ignore list. Any advisory in this set fails
        # the build.
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-legacy-admin.lock --progress-spinner off
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.1.0
        with:
          node-version: "20"
      - name: npm audit (production)
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret Scan (Git History)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sensitive file guard (working tree)
        run: python scripts/check_sensitive_files.py --tracked
      - name: gitleaks (full history)
        run: |
          curl -sSL --retry 3 --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build

  container:
    name: No-Key Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - name: Build image
        run: docker build -t gb-advisor:ci .
      - name: Build separate execution image with no application code
        run: |
          docker build -f Dockerfile.sandbox -t gb-advisor:sandbox-ci .
          docker run --rm --network none --entrypoint python gb-advisor:sandbox-ci -c "from pathlib import Path; assert not Path('/app').exists(); assert not Path('/workspace/solution.py').exists()"
      - name: Verify synthetic workspace Docker sandbox
        run: |
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' gb-advisor:sandbox-ci)
          python -m benchmarks.sandbox_workspace --image "$IMAGE_ID" --out /tmp/gaobao-harness-sandbox.json --failure-probes
          python - <<'PY'
          import json
          record = json.load(open("/tmp/gaobao-harness-sandbox.json"))
          assert record["sandbox"] == "DOCKER_RESTRICTED_SYNTHETIC", record
          assert record["passed"] and record["scratch_artifact_created"], record
          assert record["cleanup_verified"] is True, record
          assert record["failure_probes"]["passed"], record
          assert set(record["failure_probes"]["checks"]) == {"nonzero_exit", "invalid_marker", "output_limit", "timeout"}
          assert all(record["failure_probes"]["checks"].values()), record
          print("sandbox isolation and negative smoke passed")
          PY
      - name: Execute two synthetic code repairs inside Docker workspace
        run: |
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' gb-advisor:sandbox-ci)
          python -m benchmarks.sandbox_coding_agent --image "$IMAGE_ID" --out /tmp/gaobao-coding-agent.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/gaobao-coding-agent.json"))
          assert report["cases"] == 2 and report["passed"] == 2, report
          assert report["controller"] == "SCRIPTED_NOT_LLM", report
          assert all(r["test_runs"] == 2 for r in report["results"]), report
          print("coding sandbox smoke passed (scripted controller; real Docker)")
          PY

      - name: Verify admissions SQL analysis through the real Docker boundary
        run: |
          python -m pip install sqlalchemy
          export DATABASE_URL="sqlite:////tmp/gaobao-sandbox-admissions-ci.db"
          python - <<'PY'
          from db.database import Base, engine, get_session
          from db.models import AdmissionScore, School
          Base.metadata.create_all(engine)
          with get_session() as session:
              session.add(School(id=1, name="CI fixture school", province="CI province"))
              session.add(AdmissionScore(id=1, school_id=1, province="CI province", year=2024,
                                         batch="CI batch", subject_type="physics", min_score=600, min_rank=1000))
              session.commit()
          PY
          cat >/tmp/gaobao-analysis-ci.py <<'PY'
          import json
          import os
          from pathlib import Path
          assert os.getuid() == 65534
          assert not Path("/var/run/docker.sock").exists()
          assert "DATABASE_URL" not in os.environ
          try:
              Path("/input/rows.json").write_text("tampered")
          except OSError:
              pass
          else:
              raise AssertionError("input was writable")
          payload = json.loads(Path("/input/rows.json").read_text())
          rows = payload["rows"]
          assert len(rows) == 1
          scores = [r["min_score"] for r in rows]
          ranks = [r["min_rank"] for r in rows]
          print(json.dumps({"groups": [{"key": [rows[0]["year"]], "records": len(rows),
              "missing_min_scores": 0, "median_min_score": scores[0], "lowest_min_score": min(scores),
              "highest_min_score": max(scores), "best_min_rank": min(ranks), "worst_min_rank": max(ranks)}]}))
          PY
          image=$(docker image inspect --format='{{.Id}}' gb-advisor:sandbox-ci)
          python -m server.agent.admissions_analysis_sandbox --authorized-data --approval-ref CI-fixture \
            --province "CI province" --subject-type physics --batch "CI batch" --year-from 2024 --year-to 2024 \
            --group-by year --code /tmp/gaobao-analysis-ci.py --image "$image" --out /tmp/gaobao-analysis-ci.json
          python - <<'PY'
          import json
          receipt = json.load(open("/tmp/gaobao-analysis-ci.json"))
          assert receipt["status"] == "VERIFIED_DESCRIPTIVE_ANALYSIS", receipt
          assert receipt["cleanup_verified"] is True and receipt["row_count"] == 1, receipt
          assert receipt["admissions_recommendation_verified"] is False, receipt
          PY

      - name: Upload restricted Docker sandbox evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.2
        with:
          name: agent-workspace-sandbox-evidence
          path: |
            /tmp/gaobao-harness-sandbox.json
            /tmp/gaobao-coding-agent.json
            /tmp/gaobao-analysis-ci.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Start without any API key
        run: |
          docker run -d --name gb-advisor -p 8000:8000 gb-advisor:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
      - name: Health must report synthetic profile and real RAG state
        run: |
          python - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["data_profile"] == "SYNTHETIC_DEMO", h
          rag = h["optional_services"]["rag"]
          assert rag["state"] == "RAG_ENABLED", h
          assert rag["integrity_ok"] is True, h
          assert rag["documents"] >= 1, h
          assert h["degraded_services"] == [], h
          print(json.dumps(h, indent=2))
          PY
      - name: Synthetic data endpoints respond
        run: |
          curl -sf "http://localhost:8000/api/v1/data/schools?limit=3" | python -c "import sys,json;d=json.load(sys.stdin);assert d['items'];print('schools ok:',len(d['items']))"
      - name: No-Key RAG returns evidence and citations
        run: |
          curl -sf -X POST "http://localhost:8000/api/v1/knowledge/search" \
            -H 'Content-Type: application/json' \
            -d '{"query":"平行志愿的投档规则是什么"}' > /tmp/kb.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/kb.json"))
          assert d["has_evidence"] is True, d
          assert d["count"] >= 1, d
          assert d["citations"] and all(c.get("source") for c in d["citations"]), d
          print("rag evidence ok:", d["count"], d["citations"][0]["source"])
          PY
      - name: Production Compose credential fail-closed + positive startup
        env:
          PROD_API_IMAGE: gb-advisor:ci
        run: bash scripts/verify_prod_compose_env.sh
      - if: always()
        run: docker logs gb-advisor || true

  redistribution-gate:
    name: Redistribution Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Generate synthetic demo database
        run: python -m scripts.seed_demo_data --db data/demo.db --reset
      - name: No restricted assets may be tracked
        # Coverage threshold belongs to the full suite; this gate runs one
        # focused file and must not be judged against the global floor.
        run: pytest tests/test_public_demo_acceptance.py -q --no-header --no-cov
