name: Java Services

on:
  push:
    paths:
      - 'java-services/**'
      - 'docker-compose.java.yml'
      - 'deploy/java/**'
      - '.github/workflows/java-services.yml'
  pull_request:
    paths:
      - 'java-services/**'
      - 'docker-compose.java.yml'
      - 'deploy/java/**'
      - '.github/workflows/java-services.yml'

permissions:
  contents: read

jobs:
  java-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            java-services/pom.xml
            java-services/gateway/pom.xml
            java-services/catalog/pom.xml
      - name: Maven verification
        run: mvn -B -ntp -f java-services/pom.xml verify
