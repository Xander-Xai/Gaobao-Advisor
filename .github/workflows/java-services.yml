name: Java Services

on:
  workflow_dispatch:
  push:
    paths:
      - 'java-services/**'
      - 'docker-compose.java.yml'
      - 'deploy/java/**'
      - 'scripts/verify_java_*'
      - '.github/workflows/java-services.yml'
  pull_request:
    paths:
      - 'java-services/**'
      - 'docker-compose.java.yml'
      - 'deploy/java/**'
      - 'scripts/verify_java_*'
      - '.github/workflows/java-services.yml'

concurrency:
  group: java-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            java-services/pom.xml
            java-services/gateway/pom.xml
            java-services/catalog/pom.xml
      - name: Maven verification
        run: mvn -B -ntp -f java-services/pom.xml verify

  java-compose-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install environment generator dependencies
        run: python -m pip install -e .
      - name: Build Java, MySQL, Redis, Python and validate HTTP routes
        run: bash scripts/verify_java_compose_ci.sh
