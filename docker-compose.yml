services:
  api:
    build: .
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Local synthetic demo only; existing operator/admin auth still applies.
      APP_ENV: ${APP_ENV:-development}
      ENABLE_SYNTHETIC_AGENT_EXPERIMENT: ${ENABLE_SYNTHETIC_AGENT_EXPERIMENT:-true}
      ENABLE_OUTBOUND_FETCH: ${ENABLE_OUTBOUND_FETCH:-false}
      SYNTHETIC_TASKRUN_JOURNAL: ${SYNTHETIC_TASKRUN_JOURNAL:-/app/data/synthetic-taskruns.sqlite}
      # Explicit opt-in for preference writes; production still rejects this experimental API.
      USER_MEMORY_ENABLED: ${USER_MEMORY_ENABLED:-false}
      # Preference values are encrypted at rest; production must set the key explicitly.
      USER_MEMORY_ENCRYPTION_KEY: ${USER_MEMORY_ENCRYPTION_KEY:-}
      USER_MEMORY_ENCRYPTION_PREVIOUS_KEYS: ${USER_MEMORY_ENCRYPTION_PREVIOUS_KEYS:-}
      # Summary may use a configured provider; keep it and plaintext snapshots opt-in.
      GAOBAO_CHAT_COMPACTION_ENABLED: ${GAOBAO_CHAT_COMPACTION_ENABLED:-false}
      GAOBAO_CHAT_SNAPSHOT_ENABLED: ${GAOBAO_CHAT_SNAPSHOT_ENABLED:-false}
      GAOBAO_CHAT_SNAPSHOT_PREVIOUS_KEYS: ${GAOBAO_CHAT_SNAPSHOT_PREVIOUS_KEYS:-}
    volumes:
      # Named volume avoids host-UID/bind-mount permission failures while
      # keeping the synthetic database across container restarts.
      - gaobao_data:/app/data
    healthcheck:
      # Readiness, not liveness: /health/ready returns 503 when the DB is down.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GAOBAO_FRONTEND_PORT:-3080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GAOBAO_HTTP_PORT:-80}:80"
    volumes:
      # HTTP-only demo config; production uses nginx.conf + TLS certs.
      - ./nginx.demo.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  gaobao_data:
