[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaobao-advisor"
version = "3.0.0"
description = "基于 LangGraph、结构化查询与合成数据的 AI 志愿咨询开源工程示例"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "gaobao-ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]

dependencies = [
    "openai>=1.0.0,<3.0.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "sse-starlette>=1.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0,<3.0.0",
    "sentry-sdk>=1.30.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "alembic>=1.13,<2",
]
mysql = [
    "PyMySQL>=1.1,<2",
    "cryptography>=42",
    "alembic>=1.13,<2",
]
worker = [
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Xander-Xai/gaobao-advisor"
Repository = "https://github.com/Xander-Xai/gaobao-advisor"
Issues = "https://github.com/Xander-Xai/gaobao-advisor/issues"

[tool.setuptools.packages.find]
include = [
    "server*",
    "agent*",
    "db*",
    "quality*",
    "scrapers*",
    "analytics*",
    "scripts*",
    "benchmarks*",
    "prompts*",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
    "--cov=server",
    "--cov=quality",
    "--cov=analytics",
    "--cov=slots",
    "--cov=config",
    "--cov=db",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
    "ignore:.*Please use `import python_multipart` instead.*:PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
    "mysql: integration tests requiring MYSQL_TEST_URL",
    "redis: integration tests requiring REDIS_TEST_URL",
]

[tool.uv]
# Security floors from Dependabot/2026-11-07 (GHSA-*: first patched versions).
# Keeps uv.lock regeneration from floating transitive pins to unreviewed
# platform upgrades; raise only with audit + test evidence.
constraint-dependencies = [
    "langgraph==1.2.14",
    "langgraph-sdk==0.4.6",
    "certifi==2026.10.18",
    "urllib3==2.8.0",
    "anyio==4.14.2",
    "langsmith==0.8.18",
    "pytest>=9.0.3",
]

[tool.ruff]
# `*.md` is excluded because Ruff >= 0.16 also formats Python code blocks found
# inside Markdown. Those blocks are documentation snippets, not shipped code, and
# formatting them only churns the historical docs/ plans. Python sources are
# still checked and formatted by `ruff check .` / `ruff format --check .`.
extend-exclude = [".claude", "*.md"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "B007", "F841", "I001"]
"migrations/*.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "db", "quality", "scrapers", "analytics"]
