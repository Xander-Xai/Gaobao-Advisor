events {
    worker_connections 1024;
}

# Docker Compose overlay only. HTTP-only; not an internet production ingress.
http {
    # Open-source Nginx >=1.27.3: dynamic Docker DNS A-record discovery.
    # "resolve" updates the backend set when scaled containers stop/start.
    # A shared zone is required by upstream DNS re-resolution.
    upstream java_backend {
        zone java_backend 64k;
        resolver 127.0.0.11 valid=2s ipv6=off;
        server java-gateway:8080 resolve max_fails=1 fail_timeout=3s;
        keepalive 32;
    }
    upstream api_backend {
        server api:8000;
    }
    upstream frontend_backend {
        server frontend:80;
    }

    # Upstream address is logged server-side for measurable replica balancing.
    # Do not expose container addresses or diagnostic headers to clients.
    log_format upstream_audit '$remote_addr "$request" status=$status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /var/log/nginx/access.log upstream_audit;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self';" always;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://java_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Never forward caller-provided, spoofable X-Forwarded-For.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 3;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /ws/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
        }
    }
}
